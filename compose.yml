services:
  # PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:pg18
    container_name: rag_postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rag_password}
      POSTGRES_DB: ${DB_NAME:-rag_project}
    volumes:
      - postgres_data:/var/lib/postgresql18/data
      - ./docker/db-init.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - rag_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rag_user} -d ${DB_NAME:-rag_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (FastAPI)
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: rag_backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-rag_password}@postgres:${DB_PORT:-5432}/${DB_NAME:-rag_db}
      - PYTHONPATH=${PYTHONPATH:-/app}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      - LLM_MODEL=${LLM_MODEL:-gpt-3.5-turbo}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CHUNK_SIZE=${CHUNK_SIZE:-1000}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-200}
      - TOP_K=${TOP_K:-5}
      - SEED_DOCUMENTS_DIR=${SEED_DOCUMENTS_DIR:-/opt/seed_documents}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rag_network
    restart: unless-stopped
    volumes:
      - ./seed_documents:${SEED_DOCUMENTS_DIR:-/opt/seed_documents}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend (Streamlit)
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: rag_frontend
    env_file:
      - .env
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:8000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rag_network
    restart: unless-stopped

  # Ollama
  ollama:
    image: docker.io/ollama/ollama:0.40.16
    ports:
      - ${OLLAMA_PORT:-7869}:11434
    volumes:
      - ./src:/code
      - ./ollama/ollama:/root/.ollama
    container_name: ollama
    tty: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-24h}
      - OLLAMA_HOST=${OLLAMA_HOST:-0.0.0.0}
    networks:
      - rag_network

  # Ollama webui
  ollama-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ollama-webui
    volumes:
      - ./ollama/ollama-webui:/app/backend/data
    depends_on:
      - ollama
    ports:
      - ${WEBUI_PORT:-8080}:8080
    env_file:
      - .env
    environment:
      - USE_OLLAMA_DOCKER=${USE_OLLAMA_DOCKER:-true}
      - OLLAMA_BASE_URLS=${OLLAMA_BASE_URLS:-http://host.docker.internal:7869}
      - ENV=${WEBUI_ENV:-dev}
      - WEBUI_AUTH=${WEBUI_AUTH:-False}
      - WEBUI_NAME=${WEBUI_NAME:-valiantlynx AI}
      - WEBUI_URL=${WEBUI_URL:-http://localhost:8080}
      - NO_PROXY=host.docker.internal
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    networks:
      - rag_network


networks:
  rag_network:
    driver: bridge

volumes:
  postgres_data:
