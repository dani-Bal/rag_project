[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-project"
version = "0.1.0"
description = "A beginner-friendly Retrieval-Augmented Generation project."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chonkie>=1.7.0",
    "datetime>=6.0",
    "ftfy>=6.3.1",
    "pydantic-settings>=2.7,<3.0",
    "pypdf>=7.0.0",
    "sentence-transformers>=6.2.0",
    "altair>=6.3.0",
    "fastapi[standard]>=0.162.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.7,<3.0",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.6",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
    "asyncpg>=0.32.0",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.3",
    "langgraph-checkpoint-postgres>=3.2.0",
    "openai>=3.42.0",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-ai>=2.64.0",
    "qdrant-client>=1.20.0",
    "sqlalchemy>=2.1.8",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0,<5.0",
    "pyright>=1.1.390,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "pytest-mock>=3.14,<4.0",
    "python-dotenv>=1.0,<2.0",
    "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_project"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "ANN001",
    "ANN201",
    "ANN202",
    "D",
    "DOC201"
]

preview = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
typeCheckingMode = "basic"
include = ["src", "tests", "scruots"]
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"
reportUnknownArgumentType = "error"
reportUnknownParameterType = "error"
reportUnknownVariableType = "error"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = ["integration: tests that exercise multiple components or external services"]

[tool.coverage.run]
source = ["rag_project"]

[tool.coverage.report]
show_missing = true


[tool.uv]
package = true
